[project]
name = "data2g"
version = "0.5.3"
description = "HF data modem on the SSTVAE OFDM waveform, with ML-optimized submodes"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
train = [
    "torch>=2.13.0",
    "matplotlib>=3.7",
    "onnx>=1.23.0",
    "onnxruntime>=1.24.3",
]
tnc = ["pyaudio>=0.2.13"]
dev = ["pytest>=8.0", "pytest-xdist>=3.6"]

[project.scripts]
data2g-host = "data2g.host:main"
data2g-bulk = "data2g.bulk:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["data2g*"]

[tool.setuptools.package-data]
"data2g" = ["codes_data/*", "constellations/*.npy", "format/*.npz", "arq/zdict.bin"]

[tool.pytest.ini_options]
markers = ["slow: long-running Monte Carlo checks",
           "hf_only(reason): an HF calibration; skipped under another DATA2G_PROFILE (tests/conftest.py)",
           "python_only(reason): a Python feature native has not got yet; skipped under --native (tests/conftest.py)"]
addopts = "-m 'not slow' -n auto --dist loadgroup"
