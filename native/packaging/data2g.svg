<?xml version="1.0" encoding="UTF-8"?>
<!-- Application icon: one skywave hop, station to ionosphere to station.
     Paths only, no text, so it renders the same without fonts. Edit here,
     then run tools/gen_icons.py. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b2545"/>
      <stop offset="1" stop-color="#1b4f8a"/>
    </linearGradient>
    <clipPath id="tile"><rect x="8" y="8" width="240" height="240" rx="52"/></clipPath>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <path d="M24 92 Q128 20 232 92" fill="none" stroke="#8ecae6" stroke-width="16" stroke-linecap="round"/>
  <path d="M0 214 Q128 166 256 214 V256 H0 Z" fill="#2a9d8f" clip-path="url(#tile)"/>
  <path d="M56 192 L128 66 L200 192" fill="none" stroke="#f4a259" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="56" cy="192" r="15" fill="#e8f1f8"/>
  <circle cx="200" cy="192" r="15" fill="#e8f1f8"/>
</svg>
