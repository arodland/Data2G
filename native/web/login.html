<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data2G: log in</title>
<!-- data2g-web's login (web/web_ui.hpp): the password, then the page. -->
<style>
:root { --bg: #16181c; --panel: #1f2228; --line: #343841; --text: #e4e6ea; --dim: #9aa0aa; --accent: #4a9eff; --bad: #e05050; color-scheme: dark; }
@media (prefers-color-scheme: light) { :root { --bg: #f3f4f6; --panel: #fff; --line: #d5d8de; --text: #1c1f24; --dim: #5d636e; --accent: #1a6ed8; --bad: #c03030; color-scheme: light; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; padding: 16px; }
form { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 20px; width: 100%; max-width: 320px; display: grid; gap: 12px; }
h1 { font-size: 18px; margin: 0; }
input { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; font: inherit; }
button { background: var(--accent); border: 0; color: #fff; border-radius: 4px; padding: 6px 12px; font: inherit; cursor: pointer; }
#msg { color: var(--bad); min-height: 1.4em; margin: 0; }
</style>
</head>
<body>
<form id="login">
  <h1>Data2G</h1>
  <label for="password">Password</label>
  <input type="password" id="password" autocomplete="current-password" autofocus required>
  <button type="submit">Log in</button>
  <p id="msg" role="alert"></p>
</form>
<script>
"use strict";
document.getElementById("login").onsubmit = async e => {
  e.preventDefault();
  const msg = document.getElementById("msg");
  msg.textContent = "";
  try {
    const r = await fetch("/api/login", {method: "POST", headers: {"Content-Type": "application/json"},
                                         body: JSON.stringify({password: document.getElementById("password").value})});
    if (r.ok) { location.reload(); return; }
    msg.textContent = (await r.json()).error;
  } catch (err) {
    msg.textContent = "No connection to data2g-web.";
  }
};
</script>
</body>
</html>
