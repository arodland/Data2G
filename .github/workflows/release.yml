# Turn a draft release into a published one. Lifted from SSTVAE.
#
#   1. tools/bump_version.sh X.Y.Z: native/CMakeLists.txt, pyproject.toml,
#      data2g/__init__.py and uv.lock, committed as "Release vX.Y.Z". Push.
#   2. Create a draft release on GitHub for tag vX.Y.Z (the tag need not
#      exist yet; GitHub creates it on publish) and write the notes.
#   3. Run this workflow by hand with that tag. It checks the tag against
#      the declared versions, builds and signs all five platforms with the
#      same workflow CI runs, attaches the downloads, appends a Downloads
#      table below the notes (tools/release_notes.py), and publishes.
#
# Manual only. A tag push would release before the notes are written, and
# GitHub does not fire `release: created` for drafts. Re-running against
# the same tag rebuilds, replaces the assets and regenerates the table,
# keeping the hand-written notes; that is how a release that half-failed
# is retried.
#
# A release requires signing (native-build.yml sets DATA2G_REQUIRE_SIGNING
# when release-tag is set), so it fails until the signing secrets exist.

name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the draft release to build and publish, e.g. v0.2.0"
        required: true
        type: string

# Never two runs against one tag, and never cancel one: by the time a
# second starts the first may be most of the way through signed builds.
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  resolve:
    name: Resolve and check the version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      sha: ${{ steps.v.outputs.sha }}
    steps:
      # fetch-depth 0 for the tags: an existing tag is what gets built.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Inputs arrive as environment variables, with no ${{ }} inside the
      # script, so the script also runs outside Actions.
      - name: Parse the tag and check it against the source
        id: v
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v[0-9]*) VERSION="${TAG#v}" ;;
            *) echo "::error::'$TAG' is not a version tag (expected v1.2.3)"; exit 1 ;;
          esac
          printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::'$VERSION' is not X.Y.Z"; exit 1; }

          # The notes are written by hand on a draft, never generated here.
          TARGET="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish -q .targetCommitish)" \
            || { echo "::error::no release for $TAG: create a draft release with your notes first"; exit 1; }

          # A tag that exists wins: it is what the release names. Otherwise
          # the draft's target (a branch or a SHA), resolved to one SHA here
          # so all five builds use one commit even if the branch moves.
          # `--verify -q`: a bare rev-parse echoes what it cannot resolve.
          if SHA="$(git rev-parse --verify -q "refs/tags/$TAG^{commit}")"; then
            echo "tag $TAG exists, building $SHA"
          else
            TARGET="${TARGET:-$DEFAULT_BRANCH}"
            SHA="$(git rev-parse --verify -q "origin/$TARGET^{commit}" \
                   || git rev-parse --verify -q "$TARGET^{commit}")" \
              || { echo "::error::cannot resolve the draft's target '$TARGET' to a commit"; exit 1; }
            echo "tag $TAG does not exist yet; building $TARGET at $SHA"
          fi
          git checkout -q "$SHA"

          # Checked against the source, never written into it: a mismatch
          # would ship a download named one version reporting another.
          CMAKE_V="$(sed -n 's/^project(data2g_native VERSION \([0-9.]*\).*/\1/p' native/CMakeLists.txt | head -1)"
          PY_V="$(sed -n 's/^version = "\([0-9.]*\)".*/\1/p' pyproject.toml | head -1)"
          echo "tag=$VERSION native/CMakeLists.txt=$CMAKE_V pyproject.toml=$PY_V"
          fail=0
          [ "$CMAKE_V" = "$VERSION" ] || { echo "::error::native/CMakeLists.txt says $CMAKE_V"; fail=1; }
          [ "$PY_V" = "$VERSION" ]    || { echo "::error::pyproject.toml says $PY_V"; fail=1; }
          [ "$fail" -eq 0 ] || { echo "Run tools/bump_version.sh $VERSION, push, and re-run." >&2; exit 1; }

          { echo "tag=$TAG"; echo "version=$VERSION"; echo "sha=$SHA"; } >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: resolve
    uses: ./.github/workflows/native-build.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
      release-tag: ${{ needs.resolve.outputs.tag }}
      ref: ${{ needs.resolve.outputs.sha }}
      sign: true
    secrets: inherit

  publish:
    name: Write the download table and publish
    needs: [resolve, build]
    runs-on: ubuntu-latest
    steps:
      # The commit that was built, so its own release_notes.py writes the table.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - name: Append the downloads and drop the draft flag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          SHA: ${{ needs.resolve.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # From the assets actually on the release, never a filename
          # pattern reconstructed here (make_installer.sh owns the suffixes).
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body,assets > release.json
          python3 tools/release_notes.py release.json "$TAG" "$GITHUB_REPOSITORY" > body.md
          # --target: a draft's tag is created on publish from its target,
          # and a branch may have moved since the build; pin it to what was
          # built (ignored when the tag already exists).
          # --notes-file: notes carry backticks and dollar signs.
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
            --notes-file body.md --target "$SHA" --draft=false
          echo "published $TAG"
